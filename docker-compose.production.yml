# Standalone production stack; do not merge with the development compose file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthroute
      POSTGRES_PASSWORD: healthroute
      POSTGRES_DB: healthroute
    volumes:
      - healthroute_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthroute -d healthroute"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build:
      context: ./server
      target: production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT secret of at least 32 characters}
      CLIENT_URL: ${CLIENT_URL:?Set the public HTTPS origin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      TRUST_PROXY: "1"
    volumes:
      - ${DATABASE_CERT_DIRECTORY:-./secrets/database}:/run/database-certs:ro
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 12s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  client:
    build:
      context: ./client
      target: production
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_DIRECTORY:?Set the absolute directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  healthroute_pgdata:
