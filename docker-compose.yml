services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthroute
      POSTGRES_PASSWORD: healthroute
      POSTGRES_DB: healthroute
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthroute -d healthroute"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - healthroute_pgdata:/var/lib/postgresql/data
  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://healthroute:healthroute@postgres:5432/healthroute
      JWT_SECRET: ${JWT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      CLIENT_URL: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
  client:
    build:
      context: ./client
      target: development
    ports:
      - "5173:5173"
    depends_on:
      - server
volumes:
  healthroute_pgdata:
